<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - FoolCards 项目分析文档</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@5.1.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>
  <script src="js/diagram-modal.js" defer></script>
  <script>
    // 确保highlight.js正确加载
    window.onload = function() {
      if (typeof hljs === 'undefined') {
        console.warn('highlight.js未加载，尝试重新加载...');
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js';
        script.onload = function() {
          console.log('highlight.js已重新加载');
          if (typeof hljs !== 'undefined') {
            document.querySelectorAll('pre code').forEach((block) => {
              hljs.highlightBlock(block);
            });
          }
        };
        document.head.appendChild(script);
      }
    };

  </script></head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <a href="index.html">FoolCards 项目分析</a>
      </div>
      <nav>
        <ul>
          <li><a href="structure.html">结构图</a></li>
          <li><a href="er.html">实体关系图</a></li>
          <li><a href="flowcharts.html">流程图</a></li>
          <li><a href="ui.html">UI设计图</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h3>{{sidebar_title}}</h3>
      <ul>
        {{sidebar_content}}
      </ul>
    </aside>

    <main class="content">
      <h1>{{title}}</h1>
      <div class="content-body">
        {{content}}
      </div>
    </main>
  </div>

  <footer>
    <p>&copy; 2023 FoolCards 项目团队. 保留所有权利.</p>
  </footer>

        <script>
    // 初始化Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      securityLevel: 'loose',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis'
      },
      er: {
        useMaxWidth: true
      },
      sequence: {
        useMaxWidth: true
      },
      classDiagram: {
        useMaxWidth: true
      },
      stateDiagram: {
        useMaxWidth: true
      }
    });

    // 处理页面加载完成后的操作
    document.addEventListener('DOMContentLoaded', function() {
      // 查找所有代码块并应用语法高亮
      if (typeof hljs !== 'undefined') {
        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightBlock(block);
        });
      } else {
        console.warn('highlight.js未加载，代码高亮功能不可用');
      }

      // 使用mermaid.run()而不是手动渲染
      try {
        mermaid.run({
          querySelector: '.mermaid'
        }).catch(error => {
          console.error('Mermaid运行错误:', error);
          document.querySelectorAll('.mermaid').forEach(el => {
            el.innerHTML = '<div class="error-message"><h3>图表渲染错误</h3><p>' + error.message + '</p><pre>' + el.textContent + '</pre></div>';
          });
        });
      } catch (error) {
        console.error('Mermaid处理错误:', error);
        document.querySelectorAll('.mermaid').forEach(el => {
          el.innerHTML = '<div class="error-message"><h3>图表处理错误</h3><p>' + error.message + '</p><pre>' + el.textContent + '</pre></div>';
        });
      }
    });
  </script>
</body>
</html>
