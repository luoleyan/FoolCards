<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .container {

      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 5px;

      padding: 10px;

  <div class="container">

    <div id="progress">进度: 0/0</div>
